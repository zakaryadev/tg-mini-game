# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ludo-telegram
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false   # Render so'raydi: BotFather tokenini kiriting
